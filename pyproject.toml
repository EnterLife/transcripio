[project]
name = "transcripio"
version = "0.1.0"
description = "Local audio/video transcription UI with optional local speaker diarization."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.35",
    "PySide6>=6.7",
    "faster-whisper>=1.0",
    "pyannote.audio>=3.1",
    "huggingface_hub>=0.20",
    "imageio-ffmpeg>=0.5",
    "python-docx>=1.1",
    "openai>=1.0",
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
